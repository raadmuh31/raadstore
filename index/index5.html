<main class="container">

    <div class="form-container">

        <h1>تسجيل الدخول</h1>

        <form>

            <div class="form-group">

                <label for="email">
                    البريد الإلكتروني
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="example@email.com"
                    required
                >

            </div>

            <div class="form-group">

                <label for="password">
                    كلمة المرور
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="أدخل كلمة المرور"
                    required
                >

            </div>

            <button type="submit" class="btn">
                تسجيل الدخول
            </button>

        </form>

    </div>

</main>
