<main class="container">

    <div class="form-container">

        <h1>اتصل بي</h1>

        <p style="text-align:center; margin-bottom:25px;">
            يسعدني التواصل معك. أرسل رسالتك وسأحاول الرد في أقرب وقت.
        </p>

        <form>

            <div class="form-group">

                <label for="name">
                    الاسم
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="اكتب اسمك"
                    required
                >

            </div>

            <div class="form-group">

                <label for="email">
                    البريد الإلكتروني
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="example@email.com"
                    required
                >

            </div>

            <div class="form-group">

                <label for="subject">
                    الموضوع
                </label>

                <input
                    type="text"
                    id="subject"
                    name="subject"
                    placeholder="موضوع الرسالة"
                    required
                >

            </div>

            <div class="form-group">

                <label for="message">
                    الرسالة
                </label>

                <textarea
                    id="message"
                    name="message"
                    placeholder="اكتب رسالتك هنا..."
                    required
                ></textarea>

            </div>

            <button type="submit" class="btn">
                إرسال الرسالة
            </button>

        </form>

    </div>

</main>
